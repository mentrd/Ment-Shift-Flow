name: Update Taiwan holidays

on:
  schedule:
    # 每月 1 號 04:00 台北時間（UTC 20:00）
    - cron: '0 20 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 抓取失敗的年份會沿用既有資料並以非零離開，不會把假日清空
      - name: 抓取政府行事曆
        run: node scripts/fetch-holidays.js

      - name: 有變更才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holidays.json
          git diff --staged --quiet || git commit -m "chore: 更新台灣國定假日資料"
          git push
