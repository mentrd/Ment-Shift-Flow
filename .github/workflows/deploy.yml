name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 規則與加解密的回歸測試：讀 scripts/fixtures 的凍結快照，與線上資料無關，
      # 網頁儲存班表不會讓它紅
      - name: 測試排班規則與 vault
        run: node --test scripts/test-rules.js scripts/test-vault.js

      # schedule.json 可能由網頁 commit 或手改，結構錯或排出衝突都擋在這裡
      - name: 檢查資料
        run: node scripts/validate-data.js

      - uses: actions/configure-pages@v5

      # 純靜態站，沒有 build 步驟
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
